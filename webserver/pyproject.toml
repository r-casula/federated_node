[project]
name = "federatednode"
description = "Federated Node Webserver"
version = "1.2.1"
requires-python = "~=3.13.0"
readme = "README.md"
license = {text = "GPL-3"}

authors = [
    {name = "George Eddie", email = "george.eddie@aridhia.com"},
    {name = "Liam Smith", email = "liam.smith@aridhia.com"},
    {name = "Riccardo Casula", email = "riccardo.casula@aridhia.com"},
]
maintainers = [
    {name = "George Eddie", email = "george.eddie@aridhia.com"},
    {name = "Liam Smith", email = "liam.smith@aridhia.com"},
]

dependencies = [
    "sqlalchemy~=2.0.49",
    "psycopg2~=2.9.10",
    "alembic~=1.16.5",
    "pyjwt~=2.13.0",
    "joserfc~=1.6.8",
    "waitress~=3.0.1",
    "pymssql~=2.3.13",
    "werkzeug~=3.1.5",
    "jinja2~=3.1.5",
    "requests~=2.32.4",
    "cryptography>=48.0.1,<50.1.0",
    "urllib3~=2.7.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "python-multipart>=0.0.22",
    "httpx>=0.28.1",
    "asyncpg>=0.31.0",
    "kubernetes-asyncio>=35.0.1",
]

[tool.isort]
# Match Black's import formatting so `isort` and `black` don't fight each other.
profile = "black"
line_length = 99

[project.optional-dependencies]
dev = [
    "pylint>=3.0.3",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "pytest~=8.4.2",
    "pytest-env~=1.2.0",
    "pytest-mock~=3.15.1",
    "python-dotenv~=1.2.2",
    "pytest-cov~=7.1.0",
    "responses~=0.26.0",
    "pytest-responses~=0.5.1",
    "sqlalchemy-utils~=0.42.1",
    "black>=26.3.1",
    "flake8>=7.3.0",
    "isort>=6.0.1",
]
