[project]
name = "federatednode"
version = "1.2.0"
description = ""
authors = [
    {name = "r-casula",email = "riccardo.casula@aridhia.com"}
]
maintainers = [
    {name = "r-casula",email = "riccardo.casula@aridhia.com"}
]
license = {text = "GPL-3"}
readme = "README.md"
requires-python = ">=3.13"


dependencies = [
    "flask",
    "sqlalchemy",
    "psycopg2",
    "alembic",
    "flask-sqlalchemy",
    "pyjwt>=2.13.0",
    "joserfc>=1.6.8",
    "waitress>=3.0.1",
    "flask-swagger-ui",
    "pymssql",
    "werkzeug>=3.1.5",
    "jinja2>=3.1.5",
    "requests>=2.32.4",
    "pydantic>=2.12.5",
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "python-multipart>=0.0.22",
    "httpx>=0.28.1",
    "asyncpg>=0.31.0",
    "kubernetes-asyncio>=35.0.1",
    "pydantic-settings>=2.13.1"
    "urllib3>=2.7.0"
    "cryptography>=48.0.1",
]

[tool.isort]
# Match Black's import formatting so `isort` and `black` don't fight each other.
profile = "black"
line_length = 99

[project.optional-dependencies]
dev = [
    "pylint>=3.0.3",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "pytest",
    "pytest-env",
    "pytest-mock",
    "python-dotenv",
    "pytest-cov",
    "responses",
    "pytest-responses",
    "sqlalchemy-utils",
    "black>=26.3.1",
    "flake8>=7.3.0",
    "isort>=6.0.1",
]
