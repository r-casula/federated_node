[flake8]
# E203 (whitespace before ':') conflicts with Black's slice formatting; Black is PEP 8-correct here.
extend-ignore = E203

[coverage:run]
omit = **/*/tests/*,**/request.py,**/requests_api.py
branch = true
data_file = .coverage

[tool:pytest]
testpaths = tests/
addopts = --cov=app --cov-report xml:artifacts/coverage.xml
required_plugins = pytest-cov
